name: Tests

# Runs the node Vitest project on every push and PR. Deliberately NOT the
# `storybook` project: that one needs a real Chromium via @vitest/browser-playwright,
# which is a browser download per run for tests that cover stories rather than logic.
# `npm run test:all` runs both locally when that is wanted.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # NODE_ENV is forced to development for install and for every step below.
      # npm reads NODE_ENV=production as `omit=dev` and silently drops all 28
      # devDependencies — including vitest, typescript and eslint — which then
      # fails as `vitest: command not found` and reads like the runner is missing
      # rather than uninstalled. The runner does not set NODE_ENV, but pinning it
      # means a change to the runner image cannot reintroduce that failure.
      - name: Install dependencies
        env:
          NODE_ENV: development
        run: npm ci --include=dev

      # scraper/ is a SEPARATE package with its own package.json, and the node
      # tests import from scraper/scraper.js whose first line is
      # `import { chromium } from 'playwright-extra'` — a scraper dependency, not
      # a root one. Without this the suite passes locally (scraper/node_modules
      # exists from ordinary scraper work) and fails in CI with
      # ERR_MODULE_NOT_FOUND, which is exactly what happened on the first run.
      #
      # --ignore-scripts skips Playwright's browser download: these are node
      # tests, nothing launches a browser, and the download is ~100MB and slow.
      - name: Install scraper dependencies
        working-directory: scraper
        env:
          NODE_ENV: development
        run: npm ci --include=dev --ignore-scripts

      # NON-BLOCKING, deliberately, and this should be tightened rather than kept.
      # `npm run lint` currently exits 1 on 17 pre-existing problems (9 errors,
      # 8 warnings), all in src/hooks/* and SignalLogPage.tsx — none introduced here.
      # (Was 16 when this comment was written; one more src/ error has appeared
      # since. Re-measure before trusting the number, don't trust this line.)
      # Making it blocking today would mean CI is red on its very first run, which
      # trains people to ignore the badge, and a gate everyone ignores is worse
      # than no gate. Reporting it without failing keeps the debt visible.
      # Flip continue-on-error off once those 17 are fixed.
      - name: Lint (non-blocking — 17 known pre-existing problems in src/)
        continue-on-error: true
        env:
          NODE_ENV: development
        run: npm run lint

      # BLOCKING, and scoped to the scraper on purpose.
      #
      # The scraper had NO lint coverage at all until eslint.config.js gained a
      # scraper/**/*.js block: every rule was scoped to **/*.{ts,tsx}, so
      # `eslint scraper/scraper.js` reported zero problems because zero rules
      # applied. That false all-clear let commit() read `complete` from a scope it
      # never had — a ReferenceError that threw on every SUCCESSFUL scrape, left the
      # staleness sweep dead for every store, and recorded successes as failures.
      # `node --check` passes on it; only no-undef catches it.
      #
      # Scoped rather than repo-wide so this can be BLOCKING today: scraper/ is
      # clean right now, so the gate stays green and actually means something, while
      # the src/ debt above stays visible without holding this hostage. Widen to the
      # whole repo once those 17 are cleared and the step above goes blocking.
      - name: Lint scraper (blocking — no known problems, keep it that way)
        env:
          NODE_ENV: development
        run: npx eslint 'scraper/**/*.js'

      # NODE_ENV is deliberately NOT set here, unlike the install steps above.
      # It is needed for `npm ci` (production makes npm omit devDependencies),
      # but setting it for the BUILD makes Vite emit a React *development*
      # bundle: 805.8 kB versus 566.4 kB for the same commit. Measured, and it
      # matches the deployed 565.0 kB almost exactly. Building with it on is why
      # local numbers looked ~240 kB larger than production and why a bundle-size
      # investigation was opened against a figure that was never real.
      - name: Typecheck and build
        run: npm run build

      - name: Unit tests (node project)
        env:
          NODE_ENV: development
        run: npm test

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PackRadar — Always scanning</title>
    <meta name="description" content="Every Romanian TCG store, swept on a constant cycle. Pinged the second inventory changes." />
    <meta name="theme-color" content="#060B08" />
    <!-- NO canonical here, deliberately. useDocumentMeta sets a per-route one at
         runtime; this file must not ship a fallback.

         A hardcoded `<link rel="canonical" href="https://packradar.info/" />`
         lived here until 2026-08-06. Because Vercel serves this same document for
         every path, EVERY url declared itself a duplicate of the homepage in the
         raw HTML. Crawling and rendering are separate passes and the crawl pass
         reads this one, so /view, /stores and the five Romanian game pages each
         told Google "index the homepage instead" before useDocumentMeta ever ran.
         A canonical pointing elsewhere is strong enough that a page may never be
         queued for rendering at all. Symptom: homepage indexed, nothing else.

         It was correct when written — packradar.info and the auto-assigned
         tcg-tracker-kappa.vercel.app both served byte-identical HTML, and it
         pinned which hostname owned the content. That was then fixed properly:
         the vercel.app host now answers 301 -> https://packradar.info/ (verified
         2026-08-06). The redirect solved the problem; this line outlived it and
         became the thing suppressing every page except the one it named.

         Omitting it is strictly safer than guessing. With no canonical, Google
         self-canonicalises to the requested URL, which is what we want on every
         route; a wrong canonical drops the page. If a duplicate-hostname problem
         ever returns, fix it with a redirect or a per-path canonical injected in
         middleware.ts — never with a constant in this file. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icon-64.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PackRadar" />
    <meta property="og:title" content="PackRadar — Always scanning" />
    <meta property="og:description" content="Every Romanian TCG store, swept on a constant cycle. Pinged the second inventory changes." />
    <meta property="og:image" content="https://packradar.info/og-banner-1200x630.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PackRadar — Always scanning" />
    <meta name="twitter:description" content="Every Romanian TCG store, swept on a constant cycle. Pinged the second inventory changes." />
    <meta name="twitter:image" content="https://packradar.info/og-banner-1200x630.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
